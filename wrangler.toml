# Cloudflare Pages configuration for the analytics backend.
#
# The site itself is plain static files; only /api/* and the /admin/ gate run as
# Functions, so every content page is still served from cache.
#
# Setup, once:
#   wrangler d1 create charlotte-analytics          # paste the id below
#   wrangler d1 execute charlotte-analytics --file=./schema.sql --remote
#   node tools/hash-password.mjs 'a long passphrase'
#   wrangler pages secret put ADMIN_PASSWORD_HASH   # the pbkdf2$… line it printed
#   wrangler pages secret put SESSION_SECRET        # the second line it printed
#   wrangler pages secret put VISITOR_SALT          # any long random string
#
# Rotating VISITOR_SALT re-randomises visitor grouping from that moment on. It
# does not corrupt history — past rows keep their old hashes — but a visitor
# will not be matched across the change. Rotate on a day boundary.

name = "charlotte-square"
compatibility_date = "2026-09-16"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "charlotte-analytics"
database_id = "REPLACE_WITH_THE_ID_FROM_d1_create"
